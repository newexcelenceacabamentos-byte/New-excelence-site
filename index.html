<title>New Excelence | Textura Projetada e Acabamentos</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:#000;
padding:30px;
text-align:center;
}

header img{
width:180px;
margin-bottom:15px;
}

header h1{
font-size:34px;
}

header p{
color:#d4af37;
margin-top:10px;
}

.hero img{
width:100%;
display:block;
}

section{
padding:50px 20px;
text-align:center;
}

h2{
font-size:30px;
margin-bottom:30px;
color:#d4af37;
}

.galeria{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
padding:20px;
}

.galeria img{
width:100%;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,.5);
}
